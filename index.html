<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  <style>
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; background: #000; }
    .plyr { width: 100%; height: 100%; }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.6/shaka-player.compiled.js"></script>
  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
</head>
<body>

<video id="player" controls autoplay></video>

<script>
  document.addEventListener('DOMContentLoaded', async () => {
    const video = document.getElementById('player');

    shaka.polyfill.installAll();
    const shakaPlayer = new shaka.Player(video);

    shakaPlayer.configure({
      drm: {
        clearKeys: {
          'Vdb7mHIe21uoEDqc8hBx1A': 'SiFY2TLjFf_hP3LkSq1Ffg'
        }
      }
    });

    await shakaPlayer.load('https://requestrouter3.cdn.agiletv.net/__cl/cg:lv-r4/__c/DAZN_LALIGA1/__op/dash-wv/__f/manifest.mpd');
    
    // Inicializar la interfaz gráfica de Plyr sobre Shaka
    const plyrPlayer = new Plyr(video, { autoplay: true, volume: 1, muted: false });
  });
</script>

</body>
</html>
