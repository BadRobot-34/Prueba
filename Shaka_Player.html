<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex" />
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #000;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>

  <!-- Biblioteca oficial de Shaka Player -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.6/shaka-player.compiled.js"></script>
</head>
<body>

  <!-- Elemento de vídeo nativo de HTML5 -->
  <video id="video" autoplay controls></video>

  <script>
    async function initPlayer() {
      // Instalar polyfills para asegurar compatibilidad con el navegador/WebView
      shaka.polyfill.installAll();

      if (!shaka.Player.isBrowserSupported()) {
        console.error('El navegador no soporta Shaka Player');
        return;
      }

      const video = document.getElementById('video');
      const player = new shaka.Player(video);

      // Asegurar que el volumen esté activado y al 100%
      video.muted = false;
      video.volume = 1.0;

      // Configurar ClearKey DRM
      player.configure({
        drm: {
          clearKeys: {
            'Vdb7mHIe21uoEDqc8hBx1A': 'SiFY2TLjFf_hP3LkSq1Ffg'
          }
        }
      });

      // Manejo de errores
      player.addEventListener('error', (event) => {
        console.error('Error de Shaka Player:', event.detail);
      });

      // Cargar la transmisión DASH
      try {
        await player.load('https://requestrouter3.cdn.agiletv.net/__cl/cg:lv-r4/__c/DAZN_LALIGA1/__op/dash-wv/__f/manifest.mpd');
        // Intentar reproducción automática con sonido
        await video.play();
      } catch (e) {
        console.error('Error al cargar o reproducir el manifiesto MPD:', e);
      }
    }

    document.addEventListener('DOMContentLoaded', initPlayer);
  </script>

</body>
</html>
